<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRUZI TRADING v13.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@500;700&display=swap');
        :root { --neon: #00f2ff; --buy: #00ffa3; --sell: #ff2e63; --bg: #050505; --card: #0a0a0a; }

        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 400px; border: 2px solid var(--neon); border-radius: 20px; padding: 12px; background: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }

        .bruzi-header { text-align: center; font-family: 'Orbitron'; font-size: 24px; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); margin: 10px 0; cursor: pointer; }

        /* Painel de Configurações Expandido */
        .settings-panel { background: #111; border: 1px solid var(--neon); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: none; }
        .settings-panel label { font-size: 9px; color: var(--neon); display: block; margin-top: 8px; font-weight: bold; text-transform: uppercase; }
        .settings-panel input { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 5px; font-size: 12px; margin-top: 4px; }
        .grid-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        #chart { height: 200px; width: 100%; border-radius: 10px; margin-bottom: 15px; border: 1px solid #1a1a1a; }

        .signal-box { background: var(--card); border-radius: 15px; padding: 25px; text-align: center; border: 1px solid #1a1a1a; margin-bottom: 15px; }
        #main-signal { font-family: 'Orbitron'; font-size: 50px; font-weight: 900; line-height: 1; margin: 0; }
        .status-desc { font-size: 10px; color: gold; letter-spacing: 2px; margin-top: 15px; font-weight: bold; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .info-card { background: var(--card); border: 1px solid #1a1a1a; padding: 12px; border-radius: 12px; text-align: center; }
        .info-card label { display: block; font-size: 9px; color: var(--neon); margin-bottom: 5px; font-weight: bold; }
        .info-card span { font-size: 16px; font-weight: bold; font-family: 'Orbitron'; }

        .btn-action { width: 100%; padding: 18px; border-radius: 12px; border: none; font-family: 'Orbitron'; font-weight: 900; font-size: 16px; cursor: pointer; background: var(--sell); color: #fff; }
        .btn-active { background: var(--buy); color: #000; }

        #reportModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; background: #000; border: 2px solid var(--buy); border-radius: 15px; padding: 20px; z-index: 10000; }
        .color-buy { color: var(--buy); text-shadow: 0 0 20px var(--buy); }
        .color-sell { color: var(--sell); text-shadow: 0 0 20px var(--sell); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="bruzi-header" onclick="toggleSettings()">BRUZI TRADING ⚙️</div>
    
    <div class="settings-panel" id="settings">
        <div class="grid-settings">
            <div><label>Entrada ($):</label><input type="number" id="stake" value="10"></div>
            <div><label>Gale (Mult):</label><input type="number" id="gale" value="2.0"></div>
            <div><label>Ligar às:</label><input type="time" id="startTime" value="08:00"></div>
            <div><label>Parar às:</label><input type="time" id="endTime" value="23:59"></div>
            <div><label>Stop Win ($):</label><input type="number" id="stopWin" value="100"></div>
            <div><label>Stop Loss ($):</label><input type="number" id="stopLoss" value="50"></div>
        </div>
        <button onclick="toggleSettings()" style="width:100%; margin-top:10px; background:var(--neon); border:none; padding:8px; font-weight:bold; border-radius:5px; cursor:pointer;">SALVAR CONFIGS</button>
    </div>

    <div id="chart"></div>

    <div class="signal-box">
        <p id="main-signal" class="color-buy">OFFLINE</p>
        <div class="status-desc" id="status-desc">CLIQUE EM ATIVAR</div>
    </div>

    <div class="info-grid">
        <div class="info-card"><label>Score</label><span id="score">0 - 0</span></div>
        <div class="info-card"><label>Saldo</label><span id="balance">$ 1000.00</span></div>
        <div class="info-card"><label>Lucro Hoje</label><span id="profit">$ 0.00</span></div>
        <div class="info-card"><label>Stake Atual</label><span id="current-stake">$ 0.00</span></div>
    </div>

    <button class="btn-action" id="powerBtn" onclick="initSystem()">ATIVAR SISTEMA</button>
</div>

<div id="reportModal">
    <div id="reportContent"></div>
    <button onclick="location.reload()" style="width:100%; margin-top:20px; padding:10px; background:var(--buy); border:none; border-radius:5px; font-weight:bold;">FECHAR</button>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
    let metrics = JSON.parse(localStorage.getItem('bruzi_v13_data')) || {
        win: 0, loss: 0, profit: 0, balance: 1000, history: []
    };
    let active = false, operating = false, currentStake = 0;
    let chart, candleSeries;

    function save() { localStorage.setItem('bruzi_v13_data', JSON.stringify(metrics)); }

    function toggleSettings() {
        const p = document.getElementById('settings');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function initSystem() {
        active = true;
        currentStake = parseFloat(document.getElementById('stake').value);
        document.getElementById('powerBtn').textContent = "SISTEMA RODANDO";
        document.getElementById('powerBtn').classList.add('btn-active');
        document.getElementById('current-stake').textContent = "$ " + currentStake.toFixed(2);
        updateUI();
        initChart();
    }

    function initChart() {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#000' }, textColor: '#d1d4dc' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#111' } }
        });
        candleSeries = chart.addCandlestickSeries({ upColor: '#00ffa3', downColor: '#ff2e63', borderVisible: false });
        const ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@kline_1m");
        ws.onmessage = (e) => {
            const k = JSON.parse(e.data).k;
            window.lastPrice = parseFloat(k.c);
            candleSeries.update({ time: k.t / 1000, open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: window.lastPrice });
        };
    }

    setInterval(() => {
        if(!active) return;
        const now = new Date();
        const curT = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        if (curT >= document.getElementById('startTime').value && curT < document.getElementById('endTime').value) {
            const rem = 120 - (((now.getMinutes() * 60) + now.getSeconds()) % 120);
            document.getElementById('timer')?.textContent || ''; // Timer fake pra compatibilidade
            if(rem === 118 && !operating) runTrade();
            if(rem === 1 && operating) closeTrade();
        }
    }, 1000);

    function runTrade() {
        operating = true;
        window.entryVal = window.lastPrice;
        window.signal = Math.random() > 0.5 ? "COMPRA" : "VENDA";
        const el = document.getElementById('main-signal');
        el.textContent = window.signal;
        el.className = window.signal === "COMPRA" ? "color-buy" : "color-sell";
    }

    function closeTrade() {
        const win = (window.signal === "COMPRA") ? window.lastPrice > window.entryVal : window.lastPrice < window.entryVal;
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        if(win) {
            metrics.win++;
            let profitVal = currentStake * 0.9;
            metrics.profit += profitVal;
            metrics.balance += profitVal;
            metrics.history.push(`${time} > ✅ WIN (+$${profitVal.toFixed(2)})`);
            currentStake = parseFloat(document.getElementById('stake').value); // Reseta stake
        } else {
            metrics.loss++;
            metrics.profit -= currentStake;
            metrics.balance -= currentStake;
            metrics.history.push(`${time} > ❌ LOSS (-$${currentStake.toFixed(2)})`);
            currentStake *= parseFloat(document.getElementById('gale').value); // Aplica Gale
        }

        document.getElementById('current-stake').textContent = "$ " + currentStake.toFixed(2);
        updateUI();
        save();
        checkStops();
        operating = false;
    }

    function updateUI() {
        document.getElementById('score').textContent = `${metrics.win} - ${metrics.loss}`;
        document.getElementById('profit').textContent = `$ ${metrics.profit.toFixed(2)}`;
        document.getElementById('balance').textContent = `$ ${metrics.balance.toFixed(2)}`;
    }

    function checkStops() {
        if (metrics.profit >= parseFloat(document.getElementById('stopWin').value)) finalize("🚀 STOP WIN!");
        if (metrics.profit <= (parseFloat(document.getElementById('stopLoss').value) * -1)) finalize("📉 STOP LOSS!");
    }

    function finalize(m) {
        active = false;
        document.getElementById('reportContent').innerHTML = `<h3>${m}</h3>` + metrics.history.join("<br>");
        document.getElementById('reportModal').style.display = 'block';
    }

    updateUI();
</script>
</body>
    </html>
