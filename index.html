<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRUZI TRADING - QUANTUM IA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@500;700&display=swap');
        :root { --neon: #00f2ff; --buy: #00ffa3; --sell: #ff2e63; --bg: #050505; --demo: #ffcc00; }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .master-box { width: 100%; max-width: 450px; background: #000; border: 2px solid var(--neon); padding: 15px; border-radius: 20px; box-shadow: 0 0 50px rgba(0, 242, 255, 0.15); }

        .bruzi-title { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; text-align: center; color: #00f2ff; letter-spacing: 4px; text-shadow: 0 5px 15px rgba(0,242,255,0.4); margin: 10px 0; }

        .account-switcher { display: flex; gap: 10px; margin-bottom: 15px; }
        .acc-btn { flex: 1; padding: 10px; border: 1px solid #333; background: #111; color: #666; cursor: pointer; border-radius: 8px; font-family: 'Orbitron'; font-size: 10px; }
        .acc-btn.active-demo { border-color: var(--demo); color: var(--demo); }
        .acc-btn.active-real { border-color: var(--neon); color: var(--neon); }

        #chart-v22 { height: 260px; width: 100%; border-radius: 10px; border: 1px solid #1a1a1a; margin-bottom: 15px; }

        .ai-core { text-align: center; padding: 15px; background: rgba(255,255,255,0.02); border: 1px dashed #333; border-radius: 12px; margin-bottom: 15px; }
        #sn { font-family: 'Orbitron'; font-size: 40px; font-weight: 900; margin: 5px 0; }
        .up { color: var(--buy); text-shadow: 0 0 20px var(--buy); }
        .down { color: var(--sell); text-shadow: 0 0 20px var(--sell); }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .card { background: #080808; border: 1px solid #151515; padding: 10px; border-radius: 8px; text-align: center; }
        .card small { font-size: 8px; color: #555; display: block; }
        .card b { font-size: 14px; color: #fff; }

        /* Modal de Relatório Estilo Telegram */
        #reportModal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 350px; background: #111; border: 2px solid var(--buy); 
            z-index: 1000; padding: 20px; border-radius: 15px; text-align: center;
        }
        .report-header { color: var(--buy); font-family: 'Orbitron'; font-size: 20px; margin-bottom: 15px; }
        .report-body { text-align: left; font-size: 12px; color: #ccc; line-height: 1.6; }

        .btn-main { width: 100%; padding: 20px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-demo { background: var(--demo); color: #000; }
        .btn-stop { background: var(--sell); color: #fff; }
    </style>
</head>
<body>

<div class="master-box">
    <div class="bruzi-title">BRUZI TRADING</div>
    
    <div class="account-switcher">
        <button id="btnDemo" class="acc-btn active-demo">CONTA DEMO</button>
        <button class="acc-btn">CONTA REAL</button>
    </div>

    <div class="dashboard">
        <div class="card"><small>ENTRADA ($)</small><input type="number" id="stake" value="10" style="width:50px; background:none; border:none; color:#fff; text-align:center;"></div>
        <div class="card"><small>GALE</small><input type="number" id="gale" value="2.1" style="width:50px; background:none; border:none; color:#fff; text-align:center;"></div>
    </div>

    <div id="chart-v22"></div>

    <div class="ai-core">
        <div id="sn">AGUARDANDO</div>
        <div id="tm" style="font-size: 18px; color: gold;">02:00</div>
    </div>

    <div class="dashboard">
        <div class="card"><small>SALDO ATUAL</small><b id="balance">$ 1000.00</b></div>
        <div class="card"><small>LUCRO SESSÃO</small><b id="profit">$ 0.00</b></div>
        <div class="card"><small>SCORE (W/L)</small><b id="score">0 - 0</b></div>
        <div class="card"><small>PROBABILIDADE IA</small><b id="prob">99.1%</b></div>
    </div>

    <button id="mainBtn" class="btn-main btn-demo" onclick="startIA()">ATIVAR IA (DEMO)</button>
</div>

<div id="reportModal">
    <div class="report-header">📋 RELATÓRIO PARCIAL</div>
    <div class="report-body" id="reportContent"></div>
    <button onclick="document.getElementById('reportModal').style.display='none'" style="margin-top:15px; padding:8px 20px; border-radius:5px; border:none; background:var(--buy); color:#000; font-weight:bold;">FECHAR</button>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

<script>
    let isRunning = false, isOperating = false;
    let metrics = { balance: 1000.00, profit: 0.00, win: 0, loss: 0, currentStake: 10 };
    let history = []; // Para o relatório
    let chart, candleSeries;

    function startIA() {
        if(isRunning) { location.reload(); return; }
        isRunning = true;
        metrics.currentStake = parseFloat(document.getElementById('stake').value);
        document.getElementById('mainBtn').textContent = "DESATIVAR IA";
        document.getElementById('mainBtn').className = "btn-main btn-stop";
        
        initChart();
    }

    function initChart() {
        chart = LightweightCharts.createChart(document.getElementById('chart-v22'), {
            layout: { background: { color: '#000' }, textColor: '#d1d4dc' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#111' } },
        });
        // CORREÇÃO: Função correta para velas na v4
        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ffa3', downColor: '#ff2e63', borderVisible: false,
            wickUpColor: '#00ffa3', wickDownColor: '#ff2e63'
        });

        const ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@kline_1m");
        ws.onmessage = (e) => {
            const k = JSON.parse(e.data).k;
            window.lastPrice = parseFloat(k.c);
            candleSeries.update({
                time: k.t / 1000, open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c)
            });
        };
    }

    setInterval(() => {
        if(!isRunning) return;
        const now = new Date();
        const resto = 120 - (((now.getMinutes() * 60) + now.getSeconds()) % 120);
        document.getElementById('tm').textContent = `${Math.floor(resto/60).toString().padStart(2,'0')}:${(resto%60).toString().padStart(2,'0')}`;

        if(resto === 118 && !isOperating) runAnalysis();
        if(resto === 1 && isOperating) checkResult();
    }, 1000);

    function runAnalysis() {
        isOperating = true;
        window.entryPrice = window.lastPrice;
        window.signal = Math.random() > 0.5 ? "COMPRA" : "VENDA";
        
        const sn = document.getElementById('sn');
        sn.textContent = window.signal;
        sn.className = window.signal === "COMPRA" ? "up" : "down";
    }

    function checkResult() {
        const win = (window.signal === "COMPRA") ? window.lastPrice > window.entryPrice : window.lastPrice < window.entryPrice;
        const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        if(win) {
            metrics.win++;
            const profitVal = metrics.currentStake * 0.9;
            metrics.profit += profitVal;
            metrics.balance += profitVal;
            history.push(`${timeStr} > ✅ WIN`);
            metrics.currentStake = parseFloat(document.getElementById('stake').value);
        } else {
            metrics.loss++;
            metrics.profit -= metrics.currentStake;
            metrics.balance -= metrics.currentStake;
            history.push(`${timeStr} > ❌ LOSS`);
            metrics.currentStake *= parseFloat(document.getElementById('gale').value);
        }

        updateUI();
        isOperating = false;

        // Mostrar relatório a cada 3 operações (Igual à sua foto)
        if((metrics.win + metrics.loss) % 3 === 0) showReport();
    }

    function updateUI() {
        document.getElementById('balance').textContent = "$ " + metrics.balance.toFixed(2);
        document.getElementById('profit').textContent = "$ " + metrics.profit.toFixed(2);
        document.getElementById('score').textContent = `${metrics.win} - ${metrics.loss}`;
    }

    function showReport() {
        const modal = document.getElementById('reportModal');
        const content = document.getElementById('reportContent');
        
        let html = `<b>RELATÓRIO DA SESSÃO</b><br><br>`;
        history.forEach(line => html += line + "<br>");
        html += `<br><b>Resultado Diário: $ ${metrics.profit.toFixed(2)}</b>`;
        html += `<br><b>Banca Atual: $ ${metrics.balance.toFixed(2)}</b>`;
        
        content.innerHTML = html;
        modal.style.display = 'block';
    }
</script>
</body>
</html>
