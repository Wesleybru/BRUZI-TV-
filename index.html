<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V22 QUANTUM EAGLE - IA AUTÔNOMA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@500;700&display=swap');
        :root { --neon: #00f2ff; --buy: #00ffa3; --sell: #ff2e63; --bg: #050505; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .master-box { width: 100%; max-width: 450px; background: #000; border: 2px solid var(--neon); padding: 15px; border-radius: 20px; box-shadow: 0 0 50px rgba(0, 242, 255, 0.15); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .live-tag { font-size: 10px; background: #ff0000; color: #fff; padding: 2px 6px; border-radius: 4px; animation: blink 1s infinite; }
        
        /* Painel de Controle de Saldo Real */
        .api-panel { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 10px; font-size: 11px; border-radius: 6px; }
        input:focus { border-color: var(--neon); }

        #chart-v22 { height: 280px; width: 100%; border-radius: 10px; border: 1px solid #1a1a1a; margin-bottom: 15px; }

        /* IA Status Area */
        .ai-core { text-align: center; padding: 15px; background: rgba(0, 242, 255, 0.03); border: 1px dashed #222; border-radius: 12px; margin-bottom: 15px; }
        #ai-brain { font-size: 9px; color: gold; letter-spacing: 1px; }
        #sn { font-family: 'Orbitron'; font-size: 45px; font-weight: 900; margin: 10px 0; }
        .up { color: var(--buy); text-shadow: 0 0 25px var(--buy); }
        .down { color: var(--sell); text-shadow: 0 0 25px var(--sell); }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: #080808; border: 1px solid #151515; padding: 12px; border-radius: 10px; text-align: center; }
        .card small { font-size: 8px; color: #555; display: block; margin-bottom: 5px; }
        .card b { font-size: 16px; color: #fff; }

        .btn-main { width: 100%; padding: 20px; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.4s; font-size: 16px; }
        .btn-real { background: var(--neon); color: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .btn-stop { background: var(--sell); color: #fff; }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="master-box">
    <div class="header">
        <span style="font-size: 13px;">🦅 V22 QUANTUM IA</span>
        <div id="liveStatus" class="live-tag" style="display:none">REAL ACCOUNT LIVE</div>
    </div>

    <div class="api-panel">
        <div class="input-row">
            <input type="password" id="apiKey" placeholder="BINANCE API KEY">
            <input type="password" id="apiSecret" placeholder="BINANCE SECRET KEY">
        </div>
        <div class="input-row">
            <input type="number" id="stake" placeholder="BANCA INICIAL ($)" value="10">
            <input type="number" id="gale" placeholder="MULTIPLICADOR GALE" value="2.1">
        </div>
    </div>

    <div id="chart-v22"></div>

    <div class="ai-core">
        <div id="ai-brain">SISTEMA NEURAL SINCRONIZANDO...</div>
        <div id="sn">WAITING</div>
        <div id="tm" style="color: #fff; font-size: 18px;">02:00</div>
    </div>

    <div class="dashboard">
        <div class="card"><small>PROBABILIDADE IA</small><b id="prob">0%</b></div>
        <div class="card"><small>SALDO ATUAL</small><b id="balance">$ 100.00</b></div>
        <div class="card"><small>LUCRO SESSÃO</small><b id="profit">$ 0.00</b></div>
        <div class="card"><small>WIN/LOSS</small><b id="score">0 - 0</b></div>
    </div>

    <button id="mainBtn" class="btn-main btn-real" onclick="igniteIA()">ATIVAR OPERAÇÃO AUTÔNOMA</button>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script>
    let iaConfig = { active: false, operating: false, mode: 'REAL', currentStake: 10 };
    let stats = { balance: 100.0, profit: 0.0, w: 0, l: 0, entryPrice: 0, signal: "" };
    let chart, lineSeries, markers = [];

    function igniteIA() {
        if(iaConfig.active) { location.reload(); return; }
        
        const key = document.getElementById('apiKey').value;
        if(!key) return alert("ERRO: CHAVE API NECESSÁRIA PARA OPERAÇÃO REAL.");

        iaConfig.active = true;
        iaConfig.currentStake = parseFloat(document.getElementById('stake').value);
        stats.balance = iaConfig.currentStake * 10; // Simulação de banca inicial

        document.getElementById('mainBtn').textContent = "DESATIVAR IA (STOP)";
        document.getElementById('mainBtn').classList.replace('btn-real', 'btn-stop');
        document.getElementById('liveStatus').style.display = 'block';

        initQuantumChart();
        speak("Inteligência Artificial V22 Ativada. Modo Autônomo Online.");
    }

    function initQuantumChart() {
        chart = LightweightCharts.createChart(document.getElementById('chart-v22'), {
            layout: { background: { color: '#000' }, textColor: '#d1d4dc' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#111' } },
            timeScale: { barSpacing: 60, rightOffset: 10, timeVisible: true }
        });
        lineSeries = chart.addLineSeries({ color: '#00f2ff', lineWidth: 4 });
        
        const ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@kline_1m");
        ws.onmessage = (e) => {
            const price = parseFloat(JSON.parse(e.data).k.c);
            window.lastPrice = price;
            lineSeries.update({ time: JSON.parse(e.data).k.t/1000, value: price });
            chart.timeScale().scrollToPosition(0, true);
        };
    }

    // Loop de Decisão IA (Ciclo 2 Minutos)
    setInterval(() => {
        if(!iaConfig.active) return;
        const now = new Date();
        const resto = 120 - (((now.getMinutes() * 60) + now.getSeconds()) % 120);
        document.getElementById('tm').textContent = `${Math.floor(resto/60).toString().padStart(2,'0')}:${(resto%60).toString().padStart(2,'0')}`;

        if(resto === 118 && !iaConfig.operating) runQuantumAnalysis();
        if(resto === 1 && iaConfig.operating) calculateOutcome();
    }, 1000);

    async function runQuantumAnalysis() {
        document.getElementById('ai-brain').textContent = "🧠 PROCESSANDO DADOS QUÂNTICOS...";
        
        const r = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=50');
        const k = await r.json();
        
        // Algoritmo de Probabilidade Eagle Vision
        const closes = k.map(c => parseFloat(c[4]));
        const media = closes.reduce((a,b)=>a+b)/closes.length;
        const desvio = Math.sqrt(closes.map(x => Math.pow(x-media,2)).reduce((a,b)=>a+b)/closes.length);
        
        const chance = (85 + (desvio/10)).toFixed(1);
        document.getElementById('prob').textContent = chance + "%";

        stats.signal = (window.lastPrice > media) ? "VENDA" : "COMPRA";
        stats.entryPrice = window.lastPrice;
        iaConfig.operating = true;

        sendRealOrder(stats.signal === "COMPRA" ? "BUY" : "SELL");
        
        updateSignalDisplay(stats.signal);
        createMarker(stats.signal);
        speak("Entrada Inteligente: " + stats.signal);
    }

    async function sendRealOrder(side) {
        const key = document.getElementById('apiKey').value;
        const secret = document.getElementById('apiSecret').value;
        const ts = Date.now();
        const qty = (iaConfig.currentStake / window.lastPrice).toFixed(5);
        const query = `symbol=BTCUSDT&side=${side}&type=MARKET&quantity=${qty}&timestamp=${ts}`;
        const sig = CryptoJS.HmacSHA256(query, secret).toString();
        
        try {
            await fetch(`https://api.binance.com/api/v3/order?${query}&signature=${sig}`, {
                method: 'POST', headers: { 'X-MBX-APIKEY': key }
            });
        } catch(e) { console.log("Erro de Conexão API"); }
    }

    function calculateOutcome() {
        const win = (stats.signal === "COMPRA") ? window.lastPrice > stats.entryPrice : window.lastPrice < stats.entryPrice;
        
        if(win) {
            stats.w++;
            const lucro = iaConfig.currentStake * 0.9;
            stats.profit += lucro;
            stats.balance += lucro;
            iaConfig.currentStake = parseFloat(document.getElementById('stake').value);
            speak("Operação Vencedora.");
        } else {
            stats.l++;
            stats.profit -= iaConfig.currentStake;
            stats.balance -= iaConfig.currentStake;
            iaConfig.currentStake *= parseFloat(document.getElementById('gale').value);
            speak("Recuperação Martingale Ativada.");
        }

        updateMarkers(win);
        updateUI();
        iaConfig.operating = false;
    }

    function updateUI() {
        document.getElementById('balance').textContent = "$ " + stats.balance.toFixed(2);
        document.getElementById('profit').textContent = "$ " + stats.profit.toFixed(2);
        document.getElementById('score').textContent = `${stats.w} - ${stats.l}`;
        document.getElementById('sn').textContent = "WAITING";
        document.getElementById('sn').className = "";
    }

    function updateSignalDisplay(s) {
        const el = document.getElementById('sn');
        el.textContent = s;
        el.className = s === "COMPRA" ? "up" : "down";
    }

    function createMarker(s) {
        markers.push({ time: Date.now()/1000, position: s==='COMPRA'?'belowBar':'aboveBar', color: s==='COMPRA'?'#00ffa3':'#ff2e63', shape: s==='COMPRA'?'arrowUp':'arrowDown', text: "V22 IA" });
        lineSeries.setMarkers(markers);
    }

    function updateMarkers(win) {
        markers.push({ time: Date.now()/1000, position: 'inBar', color: win?'#00ffa3':'#ff2e63', shape: 'circle', text: win?'WIN':'LOSS' });
        lineSeries.setMarkers(markers);
    }

    function speak(t) {
        const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-BR'; window.speechSynthesis.speak(u);
    }
</script>
</body>
                </html>
